<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダッシュボード — Formly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{--purple:#6C63FF;--coral:#FF6584;--dark:#1A1A2E;--bg:#F8F9FF;--bg2:#EEEEFF;--text:#2D2D4E;--muted:#7B7B9E;--white:#FFFFFF;--border:rgba(108,99,255,0.12);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:240px;flex-shrink:0;background:var(--dark);display:flex;flex-direction:column;padding:24px 16px;}
  .sidebar-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;
    background:linear-gradient(135deg,#8B85FF,#FF6584);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:32px;padding:0 8px;text-decoration:none;}
  .sidebar-section{font-size:0.68rem;font-weight:700;color:rgba(255,255,255,0.3);
    text-transform:uppercase;letter-spacing:0.12em;margin:16px 8px 8px;}
  .sidebar-link{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    text-decoration:none;color:rgba(255,255,255,0.6);font-size:0.88rem;font-weight:500;
    transition:all 0.2s;margin-bottom:2px;
  }
  .sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,0.08);color:#fff;}
  .sidebar-link.active{background:rgba(108,99,255,0.30);}
  .sidebar-bottom{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);}
  .user-badge{display:flex;align-items:center;gap:10px;padding:8px 12px;}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--coral));display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:700;color:#fff;flex-shrink:0;}
  .user-name{font-size:0.82rem;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-email{font-size:0.72rem;color:rgba(255,255,255,0.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* MAIN */
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  .topbar{
    padding:20px 32px;background:var(--white);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .page-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--dark);}
  .topbar-actions{display:flex;gap:10px;}
  .btn-sm{padding:8px 18px;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all 0.2s;}
  .btn-primary-sm{background:var(--purple);color:#fff;box-shadow:0 3px 12px rgba(108,99,255,0.25);}
  .btn-primary-sm:hover{background:#4A42CC;}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--purple);color:var(--purple);}

  .content{padding:32px;flex:1;}

  /* STAT CARDS */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px;}
  .stat-card{background:var(--white);border-radius:16px;padding:24px;border:1.5px solid var(--border);}
  .stat-card-label{font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .stat-card-value{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--dark);}
  .stat-card-change{font-size:0.78rem;margin-top:4px;color:var(--muted);}
  .stat-card-icon{float:right;font-size:1.5rem;opacity:0.7;}

  /* FORMS LIST */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--dark);}
  .forms-table{background:var(--white);border-radius:16px;border:1.5px solid var(--border);overflow:hidden;}
  .table-head{display:grid;grid-template-columns:1fr 120px 100px 140px 120px;gap:16px;
    padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--border);
    font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .table-row{display:grid;grid-template-columns:1fr 120px 100px 140px 120px;gap:16px;
    padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;
    transition:background 0.15s;}
  .table-row:last-child{border-bottom:none;}
  .table-row:hover{background:var(--bg);}
  .form-name-cell{font-weight:600;font-size:0.9rem;display:flex;align-items:center;gap:10px;}
  .form-color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:0.75rem;font-weight:600;}
  .status-active{background:rgba(6,214,160,0.12);color:#04A680;}
  .status-closed{background:rgba(255,101,132,0.12);color:var(--coral);}
  .status-draft{background:var(--bg2);color:var(--muted);}
  .cell-muted{font-size:0.82rem;color:var(--muted);}
  .row-actions{display:flex;gap:6px;}
  .action-icon{background:var(--bg);border:1.5px solid var(--border);width:30px;height:30px;
    border-radius:7px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:0.85rem;transition:all 0.2s;text-decoration:none;color:var(--text);}
  .action-icon:hover{border-color:var(--purple);color:var(--purple);}
  .action-icon.delete:hover{border-color:var(--coral);color:var(--coral);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .big-icon{font-size:3rem;margin-bottom:16px;}
  .empty-state p{font-size:0.92rem;margin-bottom:20px;}

  /* ANALYTICS SECTION */
  .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px;}
  .chart-card{background:var(--white);border-radius:16px;padding:24px;border:1.5px solid var(--border);}
  .chart-title{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:700;color:var(--dark);margin-bottom:4px;}
  .chart-sub{font-size:0.78rem;color:var(--muted);margin-bottom:20px;}
  .chart-container{position:relative;height:200px;}

  /* FORM DETAIL MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(26,26,46,0.7);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white);border-radius:24px;padding:0;width:100%;max-width:700px;position:relative;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;}
  .modal-header{padding:28px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-header h2{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;}
  .modal-close{background:var(--bg);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .modal-body{padding:28px 32px;overflow-y:auto;flex:1;}
  .modal-tabs{display:flex;gap:0;margin-bottom:24px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;}
  .modal-tab{flex:1;padding:10px;text-align:center;font-size:0.85rem;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;border:none;transition:all 0.2s;font-family:'Inter',sans-serif;}
  .modal-tab.active{background:var(--purple);color:#fff;}
  .url-box{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:0.85rem;color:var(--text);font-family:monospace;word-break:break-all;margin-bottom:12px;}
  .copy-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .responses-list{display:flex;flex-direction:column;gap:12px;}
  .response-card{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:16px;}
  .response-time{font-size:0.75rem;color:var(--muted);margin-bottom:10px;}
  .response-field{margin-bottom:8px;}
  .response-field label{font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
  .response-field .value{font-size:0.88rem;color:var(--text);}
  #qrCanvas{display:block;margin:16px auto;border-radius:12px;}

  @media(max-width:900px){
    .sidebar{display:none;}
    .analytics-grid{grid-template-columns:1fr;}
    .table-head,.table-row{grid-template-columns:1fr 100px 80px;}
    .table-head>:nth-child(4),.table-head>:nth-child(5),
    .table-row>:nth-child(4),.table-row>:nth-child(5){display:none;}
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <a href="index.html" class="sidebar-logo">Formly</a>
  <div class="sidebar-section">メニュー</div>
  <a href="dashboard.html" class="sidebar-link active">📊 ダッシュボード</a>
  <a href="builder.html" class="sidebar-link">✏️ 新しいフォーム</a>
  <a href="#" class="sidebar-link" onclick="showMyForms()">📋 マイフォーム</a>
  <div class="sidebar-section">分析</div>
  <a href="#" class="sidebar-link" onclick="showAnalytics()">📈 回答集計</a>
  <div class="sidebar-bottom">
    <div class="user-badge">
      <div class="user-avatar" id="avatarInitial">?</div>
      <div>
        <div class="user-name" id="sidebarUserName">ゲスト</div>
        <div class="user-email" id="sidebarEmail">ログインしてください</div>
      </div>
    </div>
    <a href="#" class="sidebar-link" onclick="signOut()" style="margin-top:8px;">🚪 ログアウト</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">
  <div class="topbar">
    <div class="page-title" id="pageTitle">ダッシュボード</div>
    <div class="topbar-actions">
      <button class="btn-sm btn-outline" onclick="exportAll()">📥 CSV出力</button>
      <a href="builder.html" class="btn-sm btn-primary-sm">＋ 新しいフォーム</a>
    </div>
  </div>

  <div class="content">
    <!-- STATS -->
    <div class="stat-grid" id="statGrid">
      <div class="stat-card"><div class="stat-card-icon">📋</div><div class="stat-card-label">フォーム数</div><div class="stat-card-value" id="statForms">-</div><div class="stat-card-change">作成済みフォーム</div></div>
      <div class="stat-card"><div class="stat-card-icon">💬</div><div class="stat-card-label">総回答数</div><div class="stat-card-value" id="statResponses">-</div><div class="stat-card-change">全フォーム合計</div></div>
      <div class="stat-card"><div class="stat-card-icon">🟢</div><div class="stat-card-label">公開中</div><div class="stat-card-value" id="statActive">-</div><div class="stat-card-change">アクティブフォーム</div></div>
      <div class="stat-card"><div class="stat-card-icon">📅</div><div class="stat-card-label">今週の回答</div><div class="stat-card-value" id="statWeek">-</div><div class="stat-card-change">過去7日間</div></div>
    </div>

    <!-- FORMS LIST -->
    <div class="section-header">
      <div class="section-title">マイフォーム</div>
      <a href="builder.html" class="btn-sm btn-outline" style="font-size:0.82rem;padding:6px 14px;">＋ 作成</a>
    </div>
    <div class="forms-table">
      <div class="table-head">
        <div>フォーム名</div>
        <div>ステータス</div>
        <div>回答数</div>
        <div>作成日</div>
        <div>操作</div>
      </div>
      <div id="formsList"><div class="empty-state"><div class="big-icon">📋</div><p>フォームがありません</p><a href="builder.html" class="btn-sm btn-primary-sm" style="display:inline-block;text-decoration:none;">最初のフォームを作る</a></div></div>
    </div>

    <!-- ANALYTICS -->
    <div id="analyticsSection" style="display:none;">
      <div class="section-header" style="margin-top:32px;">
        <div class="section-title">回答集計</div>
      </div>
      <div class="analytics-grid" id="analyticsGrid"></div>
    </div>
  </div>
</div>

<!-- FORM DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">フォーム詳細</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-tabs">
        <button class="modal-tab active" onclick="switchModalTab('share',this)">🔗 共有</button>
        <button class="modal-tab" onclick="switchModalTab('responses',this)">💬 回答</button>
        <button class="modal-tab" onclick="switchModalTab('analytics',this)">📊 集計</button>
      </div>
      <div id="modalShare">
        <div style="margin-bottom:16px;">
          <div style="font-size:0.82rem;font-weight:600;color:var(--muted);margin-bottom:8px;">フォームURL</div>
          <div class="url-box" id="shareUrl"></div>
          <button class="copy-btn" onclick="copyUrl()">📋 URLをコピー</button>
        </div>
        <div>
          <div style="font-size:0.82rem;font-weight:600;color:var(--muted);margin-bottom:8px;">QRコード</div>
          <canvas id="qrCanvas" width="180" height="180"></canvas>
          <div style="text-align:center;"><button class="copy-btn" onclick="downloadQr()" style="margin-top:8px;">⬇️ QRコードを保存</button></div>
        </div>
      </div>
      <div id="modalResponses" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <span style="font-size:0.88rem;color:var(--muted);" id="responsesCount">-件の回答</span>
          <button class="copy-btn" onclick="exportCSV()">📥 CSV</button>
        </div>
        <div class="responses-list" id="responsesList"></div>
      </div>
      <div id="modalAnalytics" style="display:none;">
        <div id="analyticsCharts"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDarChAwm9_4t4CRfPiM5dVI84MjQPe5ms",
  authDomain: "senkyo-29a84.firebaseapp.com",
  projectId: "senkyo-29a84",
  storageBucket: "senkyo-29a84.firebasestorage.app",
  messagingSenderId: "734912107336",
  appId: "1:734912107336:web:b57350fc64038f7611997d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let userForms = [];
let currentFormId = null;
let currentFormData = null;
let formResponses = [];
let analyticsChartInstances = [];

onAuthStateChanged(auth, async user => {
  if(!user) { location.href='index.html'; return; }
  currentUser = user;
  const name = user.displayName || user.email?.split('@')[0] || 'ユーザー';
  document.getElementById('sidebarUserName').textContent = name;
  document.getElementById('sidebarEmail').textContent = user.email || '';
  document.getElementById('avatarInitial').textContent = name[0].toUpperCase();
  await loadForms();
});

async function loadForms() {
  try {
    const q = query(collection(db,'forms'), where('userId','==',currentUser.uid));
    const snap = await getDocs(q);
    userForms = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats();
    renderFormsList();
  } catch(e) {
    console.error('フォーム読み込みエラー:', e);
    document.getElementById('formsList').innerHTML = `<div class="empty-state"><div class="big-icon">⚠️</div><p>読み込みに失敗しました: ${e.message}</p></div>`;
  }
}

function renderStats() {
  document.getElementById('statForms').textContent = userForms.length;
  const total = userForms.reduce((s,f)=>s+(f.responseCount||0),0);
  document.getElementById('statResponses').textContent = total;
  const active = userForms.filter(f=>!f.settings?.deadline||new Date(f.settings.deadline)>new Date()).length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statWeek').textContent = '—';
}

function renderFormsList() {
  const list = document.getElementById('formsList');
  if(!userForms.length) {
    list.innerHTML = `<div class="empty-state"><div class="big-icon">📋</div><p>まだフォームがありません</p><a href="builder.html" class="btn-sm btn-primary-sm" style="display:inline-block;text-decoration:none;padding:10px 20px;">最初のフォームを作る</a></div>`;
    return;
  }
  list.innerHTML = userForms.map(f=>{
    const color = f.themeColor||'#6C63FF';
    const date = f.createdAt ? new Date(f.createdAt).toLocaleDateString('ja-JP') : '—';
    const status = f.settings?.deadline && new Date(f.settings.deadline)<new Date() ? 'closed' : 'active';
    return `<div class="table-row">
      <div class="form-name-cell">
        <div class="form-color-dot" style="background:${color}"></div>
        <span>${esc(f.title||'無題のフォーム')}</span>
      </div>
      <div><span class="status-badge status-${status}">${status==='active'?'🟢 公開中':'🔴 終了'}</span></div>
      <div class="cell-muted">${f.responseCount||0}件</div>
      <div class="cell-muted">${date}</div>
      <div class="row-actions">
        <a href="form.html?id=${f.id}" target="_blank" class="action-icon" title="プレビュー">👁</a>
        <a href="builder.html?id=${f.id}" class="action-icon" title="編集">✏️</a>
        <a href="#" class="action-icon" title="共有・集計" onclick="event.preventDefault();openDetail('${f.id}')">📊</a>
        <a href="#" class="action-icon delete" title="削除" onclick="event.preventDefault();deleteForm('${f.id}')">🗑</a>
      </div>
    </div>`;
  }).join('');
}

window.openDetail = async function(formId) {
  currentFormId = formId;
  currentFormData = userForms.find(f=>f.id===formId);
  document.getElementById('modalTitle').textContent = currentFormData?.title || 'フォーム詳細';
  const url = `${location.origin}/form.html?id=${formId}`;
  document.getElementById('shareUrl').textContent = url;
  // QR
  const canvas = document.getElementById('qrCanvas');
  QRCode.toCanvas(canvas, url, {width:180,margin:2,color:{dark:'#1A1A2E',light:'#F8F9FF'}}, ()=>{});
  // Load responses
  await loadResponses(formId);
  document.getElementById('detailModal').classList.add('open');
  switchModalTab('share', document.querySelector('.modal-tab'));
};

async function loadResponses(formId) {
  try {
    const q = query(collection(db,'responses'), where('formId','==',formId));
    const snap = await getDocs(q);
    formResponses = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderResponses();
    renderAnalyticsCharts();
  } catch(e) { console.error(e); }
}

function renderResponses() {
  document.getElementById('responsesCount').textContent = `${formResponses.length}件の回答`;
  const qs = currentFormData?.questions || [];
  const list = document.getElementById('responsesList');
  if(!formResponses.length) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">まだ回答がありません</div>';
    return;
  }
  list.innerHTML = formResponses.map((r,i)=>`
    <div class="response-card">
      <div class="response-time">#${i+1} · ${r.submittedAt?new Date(r.submittedAt).toLocaleString('ja-JP'):'—'}</div>
      ${qs.map(q=>{
        const val = r.answers?.[q.id];
        const display = Array.isArray(val)?val.join(', '):(val||'—');
        return `<div class="response-field"><label>${esc(q.label)}</label><div class="value">${esc(display)}</div></div>`;
      }).join('')}
    </div>`).join('');
}

function renderAnalyticsCharts() {
  analyticsChartInstances.forEach(c=>c.destroy());
  analyticsChartInstances=[];
  const qs = (currentFormData?.questions||[]).filter(q=>['radio','checkbox','select','rating'].includes(q.type));
  const container = document.getElementById('analyticsCharts');
  if(!qs.length) { container.innerHTML='<p style="color:var(--muted);font-size:0.9rem;">集計可能な質問がありません</p>'; return; }
  container.innerHTML = qs.map(q=>`<div style="margin-bottom:28px;"><div style="font-weight:600;margin-bottom:12px;">${esc(q.label)}</div><div style="height:200px;"><canvas id="chart_${q.id}"></canvas></div></div>`).join('');
  qs.forEach(q=>{
    const counts = {};
    formResponses.forEach(r=>{
      const val = r.answers?.[q.id];
      if(Array.isArray(val)) val.forEach(v=>{counts[v]=(counts[v]||0)+1;});
      else if(val) counts[val]=(counts[val]||0)+1;
    });
    const labels = Object.keys(counts);
    const data = Object.values(counts);
    const colors=['#6C63FF','#FF6584','#FEC02F','#06D6A0','#00B4D8','#F77F00'].slice(0,labels.length);
    const ctx = document.getElementById(`chart_${q.id}`)?.getContext('2d');
    if(!ctx) return;
    const chart = new Chart(ctx,{
      type: q.type==='rating'?'bar':'doughnut',
      data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,borderRadius:q.type==='rating'?6:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{family:'Inter',size:11},padding:12}}}}
    });
    analyticsChartInstances.push(chart);
  });
}

window.switchModalTab = function(tab,btn) {
  document.querySelectorAll('.modal-tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('modalShare').style.display = tab==='share'?'block':'none';
  document.getElementById('modalResponses').style.display = tab==='responses'?'block':'none';
  document.getElementById('modalAnalytics').style.display = tab==='analytics'?'block':'none';
  if(tab==='analytics') renderAnalyticsCharts();
};

window.closeModal = ()=>document.getElementById('detailModal').classList.remove('open');
window.copyUrl = ()=>{navigator.clipboard.writeText(document.getElementById('shareUrl').textContent);};
window.downloadQr = ()=>{
  const link=document.createElement('a');link.download='formly-qr.png';
  link.href=document.getElementById('qrCanvas').toDataURL();link.click();
};

window.deleteForm = async function(formId) {
  if(!confirm('このフォームを削除しますか？回答データも削除されます。')) return;
  try {
    await deleteDoc(doc(db,'forms',formId));
    userForms = userForms.filter(f=>f.id!==formId);
    renderStats(); renderFormsList();
  } catch(e) { alert('削除エラー: '+e.message); }
};

window.exportCSV = function() {
  const qs = currentFormData?.questions||[];
  const headers = ['送信日時',...qs.map(q=>q.label)];
  const rows = formResponses.map(r=>[
    r.submittedAt||'',
    ...qs.map(q=>{const v=r.answers?.[q.id];return Array.isArray(v)?v.join('|'):(v||'');})
  ]);
  const csv = [headers,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='responses.csv'; a.click();
};

window.exportAll = function() {
  if(!userForms.length) { alert('エクスポートするフォームがありません'); return; }
  const rows = userForms.map(f=>[f.id,f.title,f.responseCount||0,f.createdAt||'']);
  const csv = [['ID','タイトル','回答数','作成日'],...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='forms.csv'; a.click();
};

window.signOut = async ()=>{ await fbSignOut(auth); location.href='index.html'; };
window.showMyForms = ()=>{ document.getElementById('formsList').scrollIntoView({behavior:'smooth'}); };
window.showAnalytics = ()=>{ document.getElementById('analyticsSection').style.display='block'; };

document.getElementById('detailModal').addEventListener('click',e=>{if(e.target===document.getElementById('detailModal'))closeModal();});

function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
