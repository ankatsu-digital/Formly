<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フォームビルダー — Formly</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--p:#6C63FF;--pd:#4A42CC;--coral:#FF6584;--dark:#1A1A2E;--bg:#F0F1FA;--bg2:#EEEEFF;--text:#2D2D4E;--muted:#7B7B9E;--white:#fff;--border:rgba(108,99,255,0.13);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:20;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,var(--p),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.sep{width:1px;height:20px;background:var(--border);}
.tinput{border:none;outline:none;font-size:0.88rem;font-weight:600;color:var(--text);font-family:'Inter',sans-serif;background:transparent;width:180px;}
.tinput::placeholder{color:var(--muted);}
.tb-r{margin-left:auto;display:flex;gap:7px;align-items:center;}
.dot{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}
.dot.on{border-color:var(--dark);transform:scale(1.18);}
.btn{padding:6px 14px;border-radius:7px;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all .15s;white-space:nowrap;}
.btn-ol{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-ol:hover{border-color:var(--p);color:var(--p);}
.btn-pub{background:var(--p);color:#fff;box-shadow:0 3px 10px rgba(108,99,255,.28);}
.btn-pub:hover{background:var(--pd);}

/* LAYOUT */
.wrap{display:flex;flex:1;overflow:hidden;}

/* LEFT */
.left{width:280px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:10px 6px;text-align:center;font-size:0.76rem;font-weight:600;cursor:pointer;color:var(--muted);border:none;border-bottom:2px solid transparent;background:transparent;font-family:'Inter',sans-serif;transition:all .15s;}
.tab.on{color:var(--p);border-bottom-color:var(--p);}
.panel{flex:1;overflow-y:auto;padding:10px;}
.panel.hide{display:none;}

/* セクションツリー（左パネル） */
.sec-item{margin-bottom:6px;}
.sec-hdr{background:rgba(108,99,255,.07);border:1.5px solid rgba(108,99,255,.2);border-radius:9px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;}
.sec-hdr.on{border-color:var(--p);}
.sec-ico{font-size:.85rem;}
.sec-name{font-size:.76rem;font-weight:700;color:var(--p);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sec-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.68rem;padding:1px 3px;}
.sec-del:hover{color:var(--coral);}
.sec-qs{padding:3px 0 0 12px;display:flex;flex-direction:column;gap:4px;}
.qi{background:#F8F9FF;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s;}
.qi:hover,.qi.on{border-color:var(--p);background:rgba(108,99,255,.04);}
.qi-ico{width:22px;height:22px;border-radius:5px;background:rgba(108,99,255,.10);display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;}
.qi-info{flex:1;min-width:0;}
.qi-lbl{font-size:.73rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qi-typ{font-size:.62rem;color:var(--muted);}
.qi-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.65rem;padding:1px 3px;border-radius:3px;opacity:0;transition:opacity .15s;}
.qi:hover .qi-del{opacity:1;}
.qi-del:hover{color:var(--coral);}

/* セクション追加ボタン */
.btn-add-sec{width:100%;background:rgba(108,99,255,.06);border:1.5px dashed rgba(108,99,255,.25);border-radius:9px;padding:8px;cursor:pointer;font-size:.74rem;font-weight:600;color:var(--p);font-family:'Inter',sans-serif;margin-bottom:8px;transition:all .15s;}
.btn-add-sec:hover{background:rgba(108,99,255,.12);}

.add-lbl{font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;margin-top:10px;}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.fb{background:#F8F9FF;border:1.5px solid var(--border);border-radius:7px;padding:6px 2px;text-align:center;cursor:pointer;font-size:.62rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Inter',sans-serif;transition:all .15s;}
.fb:hover{border-color:var(--p);color:var(--p);background:rgba(108,99,255,.05);}
.fb .fi{font-size:.88rem;}

/* 設定タブ */
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.slbl{font-size:.82rem;font-weight:600;}.ssub{font-size:.68rem;color:var(--muted);}
.tog{width:36px;height:20px;border-radius:10px;background:#D0D0E8;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.tog.on{background:var(--p);}
.tog::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog.on::after{left:19px;}
.sinput{width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:.78rem;font-family:'Inter',sans-serif;background:#F8F9FF;color:var(--text);outline:none;margin-top:5px;display:none;}
.sinput.show{display:block;}
.sinput:focus{border-color:var(--p);}

/* CENTER */
.center{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;align-items:center;background:var(--bg);}
.form-stack{width:100%;max-width:660px;padding:0 16px;display:flex;flex-direction:column;}
.fhdr{background:var(--white);border-radius:14px 14px 0 0;padding:24px 28px 16px;border:1.5px solid var(--border);border-bottom:none;width:100%;}
.cbar{height:5px;border-radius:3px;margin-bottom:18px;}
.ctitle{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;border:none;outline:none;background:transparent;width:100%;color:var(--dark);margin-bottom:5px;display:block;}
.cdesc{font-size:.83rem;color:var(--muted);border:none;outline:none;background:transparent;width:100%;resize:none;font-family:'Inter',sans-serif;line-height:1.55;display:block;}

/* セクションカード */
.sec-card{background:var(--white);border:1.5px solid var(--border);border-top:none;width:100%;position:relative;}
.sec-card.active-sec{border-color:var(--p);}
.sec-card:last-of-type{border-radius:0 0 14px 14px;}
.sec-banner{padding:14px 24px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;}
.sec-bar{width:4px;border-radius:2px;height:36px;flex-shrink:0;}
.sec-title-wrap{flex:1;}
.sec-title-in{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;border:none;outline:none;background:transparent;color:var(--dark);width:100%;display:block;}
.sec-desc-in{font-size:.78rem;color:var(--muted);border:none;outline:none;background:transparent;width:100%;font-family:'Inter',sans-serif;resize:none;display:block;}
.sec-actions{display:flex;gap:4px;align-items:center;}
.sec-act{background:none;border:1.5px solid var(--border);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:.72rem;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .12s;}
.sec-act:hover{border-color:var(--p);color:var(--p);}
.sec-act.del:hover{border-color:var(--coral);color:var(--coral);}

/* セクション内の質問リスト */
.sec-body{padding:10px 24px 14px;}
.sec-next-box{margin-top:8px;padding:8px 12px;background:rgba(108,99,255,.04);border:1.5px solid rgba(108,99,255,.14);border-radius:8px;font-size:.72rem;}
.sec-next-title{font-weight:700;color:var(--p);margin-bottom:5px;}
.sec-next-sel{width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:.74rem;font-family:'Inter',sans-serif;background:var(--white);color:var(--text);outline:none;cursor:pointer;}

/* 質問カード（セクション内） */
.qcard{background:#FAFBFF;border:1.5px solid var(--border);border-radius:10px;padding:14px 18px 10px;margin-bottom:8px;cursor:pointer;position:relative;transition:border-color .15s;}
.qcard:hover{border-color:rgba(108,99,255,.22);}
.qcard.on{border-color:var(--p);border-left:3px solid var(--p);}
.qrow{display:flex;gap:8px;} /* 2カラムレイアウト用 */
.qcol{flex:1;min-width:0;}
.qnum{font-size:.63rem;color:var(--muted);font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:4px;}
.req{color:var(--coral);}
.qinput{font-size:.88rem;font-weight:600;border:none;outline:none;background:transparent;width:100%;color:var(--text);font-family:'Inter',sans-serif;margin-bottom:2px;display:block;}
.qdesc-in{font-size:.75rem;color:var(--muted);border:none;outline:none;background:transparent;width:100%;font-family:'Inter',sans-serif;margin-bottom:8px;resize:none;display:block;}

/* プレビュー */
.pinput{width:100%;padding:7px 11px;border:1.5px solid var(--bg2);border-radius:7px;font-size:.8rem;background:#F0F1FA;color:var(--muted);font-family:'Inter',sans-serif;pointer-events:none;display:block;}
.ptextarea{width:100%;padding:7px 11px;border:1.5px solid var(--bg2);border-radius:7px;font-size:.8rem;background:#F0F1FA;color:var(--muted);font-family:'Inter',sans-serif;height:55px;resize:none;pointer-events:none;display:block;}
.popts{display:flex;flex-direction:column;gap:4px;}
.popt{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--bg2);border-radius:7px;background:#F0F1FA;font-size:.8rem;color:var(--muted);}
.ocircle{width:11px;height:11px;border-radius:50%;border:2px solid var(--bg2);flex-shrink:0;}
.osquare{width:11px;height:11px;border-radius:3px;border:2px solid var(--bg2);flex-shrink:0;}
.btn-eopt{background:rgba(108,99,255,.09);border:none;cursor:pointer;color:var(--p);font-size:.62rem;padding:2px 4px;border-radius:3px;margin-left:auto;font-family:'Inter',sans-serif;}
.btn-xopt{background:rgba(255,101,132,.09);border:none;cursor:pointer;color:var(--coral);font-size:.62rem;padding:2px 4px;border-radius:3px;margin-left:2px;font-family:'Inter',sans-serif;}
.btn-aopt{background:none;border:none;cursor:pointer;color:var(--p);font-size:.72rem;font-weight:600;padding:2px 0;display:flex;align-items:center;gap:3px;font-family:'Inter',sans-serif;margin-top:2px;}
.pstars{font-size:1.1rem;color:#FEC02F;}

/* 条件分岐UI（セクション内） */
.branch-ui{margin-top:8px;background:rgba(108,99,255,.04);border:1.5px solid rgba(108,99,255,.14);border-radius:8px;padding:9px 11px;}
.branch-title{font-size:.67rem;font-weight:700;color:var(--p);margin-bottom:6px;}
.brow{display:flex;align-items:center;gap:5px;margin-bottom:5px;font-size:.72rem;}
.brow:last-child{margin-bottom:0;}
.b-opt{background:rgba(108,99,255,.09);border-radius:4px;padding:2px 6px;font-weight:600;color:var(--p);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;font-size:.68rem;}
.b-arr{color:var(--muted);font-size:.68rem;flex-shrink:0;}
.b-sel{flex:1;padding:3px 6px;border:1.5px solid var(--border);border-radius:5px;font-size:.7rem;font-family:'Inter',sans-serif;background:var(--white);color:var(--text);outline:none;cursor:pointer;}

/* 質問アクションバー */
.qacts{display:none;position:absolute;top:8px;right:8px;gap:3px;align-items:center;}
.qcard.on .qacts{display:flex;}
.qa{background:var(--white);border:1.5px solid var(--border);border-radius:5px;cursor:pointer;color:var(--muted);font-size:.68rem;padding:2px 6px;font-family:'Inter',sans-serif;transition:all .12s;}
.qa:hover{border-color:var(--p);color:var(--p);}
.qa.del:hover{border-color:var(--coral);color:var(--coral);}

/* 質問追加ボタン（セクション内） */
.btn-add-q-in{background:transparent;border:1.5px dashed rgba(108,99,255,.2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.73rem;font-weight:600;color:var(--p);font-family:'Inter',sans-serif;transition:all .15s;width:100%;text-align:left;display:flex;align-items:center;gap:5px;}
.btn-add-q-in:hover{background:rgba(108,99,255,.04);border-color:var(--p);}
.btn-add-q-in .add-type-menu{display:none;position:absolute;left:0;right:0;background:var(--white);border:1.5px solid var(--border);border-radius:9px;padding:6px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:4px;}
.btn-add-q-wrap{position:relative;}
.btn-add-q-wrap.open .add-type-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.atm-btn{background:#F8F9FF;border:1.5px solid var(--border);border-radius:6px;padding:5px 2px;cursor:pointer;font-size:.6rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'Inter',sans-serif;transition:all .12s;}
.atm-btn:hover{border-color:var(--p);color:var(--p);}
.atm-icon{font-size:.85rem;}

/* 2カラムバッジ */
.badge-2col{background:rgba(108,99,255,.1);color:var(--p);font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px;}

/* RIGHT */
.right{width:230px;flex-shrink:0;background:var(--white);border-left:1px solid var(--border);overflow-y:auto;padding:12px;}
.rtitle{font-family:'Syne',sans-serif;font-size:.73rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:11px;}
.prow{margin-bottom:11px;}
.plbl{font-size:.73rem;font-weight:600;color:var(--text);margin-bottom:4px;display:block;}
.pinp{width:100%;padding:6px 9px;border:1.5px solid var(--border);border-radius:6px;font-size:.78rem;font-family:'Inter',sans-serif;background:#F8F9FF;color:var(--text);outline:none;}
.pinp:focus{border-color:var(--p);}
.psel{width:100%;padding:6px 9px;border:1.5px solid var(--border);border-radius:6px;font-size:.78rem;font-family:'Inter',sans-serif;background:#F8F9FF;color:var(--text);outline:none;cursor:pointer;}
.req-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;margin-bottom:8px;}

/* 公開モーダル */
.overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(26,26,46,.65);backdrop-filter:blur(6px);align-items:center;justify-content:center;}
.overlay.open{display:flex;animation:fi .18s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);border-radius:18px;padding:28px;width:100%;max-width:440px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.22);animation:su .25s cubic-bezier(.22,1,.36,1);}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.mcl{position:absolute;top:12px;right:12px;background:#F8F9FF;border:none;border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.modal h2{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;margin-bottom:3px;}
.msub{font-size:.8rem;color:var(--muted);margin-bottom:16px;}
.urlbox{background:#F8F9FF;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.76rem;color:var(--text);font-family:monospace;word-break:break-all;margin-bottom:9px;}
.mbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--p);color:#fff;border:none;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-right:6px;margin-bottom:6px;text-decoration:none;}
.mbtn:hover{background:var(--pd);}
.mbtn.g{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.mbtn.g:hover{border-color:var(--p);color:var(--p);}
#qrDiv{margin:14px auto 10px;width:160px;}
.toast{position:fixed;bottom:16px;right:16px;z-index:999;background:var(--dark);color:#fff;border-radius:8px;padding:10px 16px;font-size:.8rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 5px 20px rgba(0,0,0,.22);}
.toast.show{opacity:1;}

/* 質問追加エリア（アクティブセクション：常時表示グリッド） */
.add-q-panel{background:rgba(108,99,255,.03);border:1.5px solid rgba(108,99,255,.12);border-radius:10px;padding:10px 12px;margin-top:6px;}
.add-q-label{font-size:.65rem;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.add-q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.aqb{background:var(--white);border:1.5px solid var(--border);border-radius:7px;padding:7px 3px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Inter',sans-serif;transition:all .12s;}
.aqb:hover{border-color:var(--p);background:rgba(108,99,255,.06);}
.aqb-icon{font-size:1rem;line-height:1;}
.aqb-lbl{font-size:.58rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;}
.aqb:hover .aqb-lbl{color:var(--p);}
/* 非アクティブセクションの折りたたみ追加ボタン */
.btn-add-q-collapsed{width:100%;background:transparent;border:1.5px dashed rgba(108,99,255,.15);border-radius:8px;padding:7px;cursor:pointer;font-size:.73rem;font-weight:600;color:var(--muted);font-family:'Inter',sans-serif;margin-top:6px;transition:all .15s;}
.btn-add-q-collapsed:hover{border-color:var(--p);color:var(--p);}
/* 既存メニュー（残存する場合のフォールバック） */
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="logo">Formly</a>
  <div class="sep"></div>
  <input class="tinput" id="topTitle" placeholder="フォームのタイトル..." value="新しいフォーム">
  <div class="tb-r">
    <span style="font-size:.68rem;color:var(--muted);font-weight:600;">テーマ：</span>
    <div class="dot on" style="background:#6C63FF" data-c="#6C63FF" onclick="setTheme(this)"></div>
    <div class="dot" style="background:#FF6584" data-c="#FF6584" onclick="setTheme(this)"></div>
    <div class="dot" style="background:#00B4D8" data-c="#00B4D8" onclick="setTheme(this)"></div>
    <div class="dot" style="background:#06D6A0" data-c="#06D6A0" onclick="setTheme(this)"></div>
    <div class="dot" style="background:#F77F00" data-c="#F77F00" onclick="setTheme(this)"></div>
    <button class="btn btn-ol" onclick="previewForm()">👁 プレビュー</button>
    <button class="btn btn-pub" onclick="saveForm()">💾 保存して公開</button>
  </div>
</div>

<div class="wrap">
  <!-- LEFT -->
  <div class="left">
    <div class="tabs">
      <button class="tab on" onclick="switchTab('q',this)">質問</button>
      <button class="tab" onclick="switchTab('s',this)">設定</button>
    </div>
    <div class="panel" id="tabQ">
      <button class="btn-add-sec" onclick="addSection()">📌 ＋ セクションを追加</button>
      <div id="secTree"></div>
    </div>
    <div class="panel hide" id="tabS">
      <div class="srow"><div><div class="slbl">📅 公開日時</div><div class="ssub">指定日時から受付開始</div></div><button class="tog" id="tgPub" onclick="togSet(this,'iPub')"></button></div>
      <input class="sinput" type="datetime-local" id="iPub">
      <div class="srow"><div><div class="slbl">⏰ 締切日時</div><div class="ssub">指定日時で自動終了</div></div><button class="tog" id="tgD" onclick="togSet(this,'iD')"></button></div>
      <input class="sinput" type="datetime-local" id="iD">

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDarChAwm9_4t4CRfPiM5dVI84MjQPe5ms",
  authDomain:"senkyo-29a84.firebaseapp.com",
  projectId:"senkyo-29a84",
  storageBucket:"senkyo-29a84.firebasestorage.app",
  messagingSenderId:"734912107336",
  appId:"1:734912107336:web:b57350fc64038f7611997d"
});
var db=firebase.firestore(), auth=firebase.auth();

// ===== データ構造 =====
// sections = [{id, title, desc, color, nextSection, questions:[{id,t,l,desc,req,opts,ph,twoCol,colLabel,branches}]}]
var sections = [];
var activeSecId = null;
var activeQId = null;
var theme = '#6C63FF';
var currentUser = null;
var formId = null;

auth.onAuthStateChanged(function(u){currentUser=u;});

var FT=[
  {t:'short',i:'✏️',l:'短文'},{t:'long',i:'📝',l:'長文'},{t:'number',i:'🔢',l:'数字'},
  {t:'email',i:'📧',l:'メール'},{t:'tel',i:'📞',l:'電話'},{t:'date',i:'📅',l:'日付'},
  {t:'time',i:'⏰',l:'時間'},{t:'radio',i:'🔘',l:'ラジオ'},{t:'checkbox',i:'☑️',l:'チェック'},
  {t:'select',i:'▾',l:'プルダウン'},{t:'rating',i:'⭐',l:'評価'},{t:'slider',i:'🎚',l:'スライダー'},
  {t:'file',i:'📎',l:'ファイル'},{t:'agree',i:'✅',l:'同意'},{t:'url',i:'🔗',l:'URL'},
  {t:'2col',i:'⊟',l:'2カラム'},
];

function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function togSet(btn,iid){
  btn.classList.toggle('on');
  var inp=document.getElementById(iid);
  if(inp)inp.classList.toggle('show',btn.classList.contains('on'));
}
function setTog(btnId,iid,val){
  var btn=document.getElementById(btnId),inp=document.getElementById(iid);
  if(val){btn.classList.add('on');if(inp)inp.classList.add('show');}
  else{btn.classList.remove('on');if(inp)inp.classList.remove('show');}
}

// ===== 初期化 =====
(function(){
  var p=new URLSearchParams(location.search);
  var id=p.get('id'),tmpl=p.get('template');
  if(id)loadForm(id);
  else{
    // デフォルト：セクション1つ+質問2つ
    var s=makeSection('基本情報');
    s.questions.push(makeQ('short','お名前',true));
    s.questions.push(makeQ('email','メールアドレス',true));
    sections.push(s);
    activeSecId=s.id;
    renderAll();
  }
})();

function makeSection(title){
  return{id:uid(),title:title||'セクション',desc:'',color:'#6C63FF',nextSection:'',questions:[]};
}
function makeQ(type,label,req){
  type=type||'short';
  var fi=FT.find(function(f){return f.t===type;})||FT[0];
  return{id:uid(),t:type,l:label||(fi.l+'の質問'),desc:'',req:!!req,
    opts:['radio','checkbox','select'].includes(type)?['選択肢1','選択肢2','選択肢3']:[],
    ph:'',twoCol:false,colLabel:'',branches:{},nextQ:''};
}

async function loadForm(id){
  try{
    var snap=await db.collection('forms').doc(id).get();
    if(!snap.exists)return;
    var d=snap.data(); formId=id;
    document.getElementById('topTitle').value=d.title||'';
    document.getElementById('cTitle').value=d.title||'';
    document.getElementById('cDesc').value=d.description||'';
    // 旧フォーマット（questions配列）→ 新フォーマット（sections）変換
    if(d.sections){
      sections=d.sections;
    } else if(d.questions){
      var s=makeSection('フォーム');
      s.questions=(d.questions||[]).map(function(q){
        return{id:q.id||uid(),t:q.t||q.type||'short',l:q.l||q.label||'質問',
          desc:q.desc||q.description||'',req:!!(q.req||q.required),
          opts:q.opts||q.options||[],ph:q.ph||q.placeholder||'',
          twoCol:false,colLabel:'',branches:q.branches||{},nextQ:q.nextQ||''};
      });
      sections=[s];
    }
    theme=d.themeColor||'#6C63FF';
    document.documentElement.style.setProperty('--p',theme);
    var dot=document.querySelector('.dot[data-c="'+theme+'"]');
    if(dot){document.querySelectorAll('.dot').forEach(function(d){d.classList.remove('on');});dot.classList.add('on');}
    var st=d.settings||{};
    setTog('tgPub','iPub',!!st.publishAt);if(st.publishAt)document.getElementById('iPub').value=st.publishAt;
    setTog('tgD','iD',!!st.deadline);if(st.deadline)document.getElementById('iD').value=st.deadline;
    setTog('tgC','iC',!!st.capacity);if(st.capacity)document.getElementById('iC').value=st.capacity;
    setTog('tgP','iP',!!st.password);if(st.password)document.getElementById('iP').value=st.password;
    if(st.oneResponse)document.getElementById('tgO').classList.add('on');
    if(st.thankMsg)document.getElementById('thankMsg').value=st.thankMsg;
    if(st.redirectUrl)document.getElementById('redirectUrl').value=st.redirectUrl;
    activeSecId=sections.length?sections[0].id:null;
    renderAll();
  }catch(ex){showToast('読み込みエラー: '+ex.message);}
}

// ===== セクション操作 =====
function addSection(){
  var s=makeSection('セクション '+(sections.length+1));
  sections.push(s);
  activeSecId=s.id; activeQId=null;
  renderAll();
  // スクロール
  setTimeout(function(){
    var el=document.getElementById('sec_'+s.id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}
function removeSection(sid){
  if(sections.length<=1){showToast('最低1つのセクションが必要です');return;}
  sections=sections.filter(function(s){return s.id!==sid;});
  if(activeSecId===sid){activeSecId=sections[0].id;activeQId=null;}
  renderAll();
}
function setActiveSection(sid){activeSecId=sid;activeQId=null;renderAll();}
function updSection(sid,k,v){
  var s=sections.find(function(x){return x.id===sid;});if(s)s[k]=v;
}
function moveSec(sid,d){
  var i=sections.findIndex(function(x){return x.id===sid;}),ni=i+d;
  if(ni<0||ni>=sections.length)return;
  var t=sections[i];sections[i]=sections[ni];sections[ni]=t;renderAll();
}

// ===== 質問操作 =====
function addQToSection(sid,type){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=makeQ(type);
  s.questions.push(q);
  activeSecId=sid;activeQId=q.id;
  renderAll();
  closeAllMenus();
}
function removeQ(sid,qid){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  s.questions=s.questions.filter(function(q){return q.id!==qid;});
  if(activeQId===qid)activeQId=null;
  renderAll();
}
function setActiveQ(sid,qid){activeSecId=sid;activeQId=qid;renderAll();}
function updQ(sid,qid,k,v){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(q)q[k]=v;
}
function moveQ(sid,qid,d){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var i=s.questions.findIndex(function(x){return x.id===qid;}),ni=i+d;
  if(ni<0||ni>=s.questions.length)return;
  var t=s.questions[i];s.questions[i]=s.questions[ni];s.questions[ni]=t;renderAll();
}
function addOpt(sid,qid){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(q)q.opts.push('選択肢'+(q.opts.length+1));renderAll();
}
function editOpt(sid,qid,i){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(!q)return;
  var old=q.opts[i],v=prompt('選択肢を編集:',old);
  if(v!==null&&v!==old){
    if(q.branches[old]!==undefined){q.branches[v]=q.branches[old];delete q.branches[old];}
    q.opts[i]=v;renderAll();
  }
}
function editOptInline(sid,qid,i,newVal){
  // インライン編集：データだけ更新（再レンダリングしない）
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(!q)return;
  var old=q.opts[i];
  if(q.branches&&q.branches[old]!==undefined){q.branches[newVal]=q.branches[old];delete q.branches[old];}
  q.opts[i]=newVal;
  // 左パネルのツリーだけ更新（フォーカスを失わないように）
  renderTree();
}
function removeOpt(sid,qid,i){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(!q)return;
  var opt=q.opts[i];delete q.branches[opt];q.opts.splice(i,1);renderAll();
}
function changeType(sid,qid,t){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(!q)return;
  q.t=t;
  if(['radio','checkbox','select'].includes(t)&&!q.opts.length)q.opts=['選択肢1','選択肢2'];
  else if(!['radio','checkbox','select'].includes(t))q.opts=[];
  q.branches={};renderAll();
}
// 条件分岐: optIndexで選択肢を参照
function setBranch(sid,qid,optIdx,targetQid){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(!q)return;
  var optVal=q.opts[optIdx];if(optVal===undefined)return;
  if(targetQid==='')delete q.branches[optVal];
  else q.branches[optVal]=targetQid;
}
function setNextQ(sid,qid,targetQid){
  var s=sections.find(function(x){return x.id===sid;});if(!s)return;
  var q=s.questions.find(function(x){return x.id===qid;});if(!q)return;
  q.nextQ=targetQid;
}

function closeAllMenus(){
  document.querySelectorAll('.btn-add-q-wrap.open').forEach(function(el){el.classList.remove('open');});
  document.getElementById('menuBg').classList.remove('open');
}
function openAddMenu(sid){
  closeAllMenus();
  var el=document.getElementById('addmenu_'+sid);
  if(el){el.classList.add('open');document.getElementById('menuBg').classList.add('open');}
}

// ===== レンダリング =====
function renderAll(){renderTree();renderCanvas();renderRight();}

function renderTree(){
  var html='';
  sections.forEach(function(s,si){
    var isActiveSec=activeSecId===s.id;
    html+='<div class="sec-item">'
      +'<div class="sec-hdr'+(isActiveSec?' on':'')+'" onclick="setActiveSection(\''+s.id+'\')">'
        +'<span class="sec-ico">📌</span>'
        +'<span class="sec-name">'+esc(s.title||'セクション')+'</span>'
        +'<button class="sec-del" onclick="event.stopPropagation();removeSection(\''+s.id+'\')" title="削除">✕</button>'
      +'</div>';
    if(isActiveSec){
      html+='<div class="sec-qs">';
      s.questions.forEach(function(q,qi){
        var fi=FT.find(function(f){return f.t===q.t;})||FT[0];
        html+='<div class="qi'+(activeQId===q.id?' on':'')+'" onclick="setActiveQ(\''+s.id+'\',\''+q.id+'\')">'
          +'<div class="qi-ico">'+fi.i+'</div>'
          +'<div class="qi-info"><div class="qi-lbl">'+(q.twoCol?'[2列] ':'')+esc(q.l)+'</div><div class="qi-typ">'+fi.l+'</div></div>'
          +'<button class="qi-del" onclick="event.stopPropagation();removeQ(\''+s.id+'\',\''+q.id+'\')" title="削除">✕</button>'
        +'</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  document.getElementById('secTree').innerHTML=html;
}

function renderCanvas(){
  document.getElementById('cbar').style.background=theme;
  var html='';
  sections.forEach(function(s,si){
    var isActiveSec=activeSecId===s.id;
    var col=s.color||theme;
    html+='<div class="sec-card'+(isActiveSec?' active-sec':'')+'" id="sec_'+s.id+'">'
      // セクションバナー
      +'<div class="sec-banner" onclick="setActiveSection(\''+s.id+'\')">'
        +'<div class="sec-bar" style="background:'+col+'"></div>'
        +'<div class="sec-title-wrap">'
          +'<input class="sec-title-in" value="'+esc(s.title)+'" placeholder="セクション名" oninput="updSection(\''+s.id+'\',\'title\',this.value)" onclick="event.stopPropagation()">'
          +'<textarea class="sec-desc-in" rows="1" placeholder="説明（任意）" oninput="updSection(\''+s.id+'\',\'desc\',this.value)" onclick="event.stopPropagation()">'+esc(s.desc||'')+'</textarea>'
        +'</div>'
        +'<div class="sec-actions" onclick="event.stopPropagation()">'
          +'<button class="sec-act" onclick="moveSec(\''+s.id+'\',-1)" title="上へ">↑</button>'
          +'<button class="sec-act" onclick="moveSec(\''+s.id+'\',1)" title="下へ">↓</button>'
          +'<button class="sec-act del" onclick="removeSection(\''+s.id+'\')" title="削除">🗑</button>'
        +'</div>'
      +'</div>'
      // セクション本体
      +'<div class="sec-body">'
        +renderSectionQuestions(s)
        // 質問追加エリア：アクティブセクションは常時グリッド表示
        +(isActiveSec
          ? '<div class="add-q-panel" onclick="event.stopPropagation()">'
              +'<div class="add-q-label">＋ フィールドを追加</div>'
              +'<div class="add-q-grid">'
                +FT.map(function(f){return '<button class="aqb" onclick="addQToSection(\''+s.id+'\',\''+f.t+'\')" title="'+f.l+'"><span class="aqb-icon">'+f.i+'</span><span class="aqb-lbl">'+f.l+'</span></button>';}).join('')
              +'</div>'
            +'</div>'
          : '<button class="btn-add-q-collapsed" onclick="event.stopPropagation();setActiveSection(\''+s.id+'\')">'
              +'＋ 質問を追加'
            +'</button>'
        )
        // 次のセクションへ
        +(sections.length>1?renderSecNext(s,si):'')
      +'</div>'
    +'</div>';
  });
  document.getElementById('canvas').innerHTML=html;
}

function renderSectionQuestions(s){
  var html='';
  s.questions.forEach(function(q,qi){
    var isActive=activeQId===q.id;
    var fi=FT.find(function(f){return f.t===q.t;})||FT[0];
    var hasChoice=['radio','checkbox','select'].includes(q.t)&&q.opts.length>0;
    html+='<div class="qcard'+(isActive?' on':'')+'" id="qc_'+q.id+'" onclick="setActiveQ(\''+s.id+'\',\''+q.id+'\')">'
      +'<div class="qnum">'+fi.i+' '+(qi+1)+(q.req?' <span class="req">必須</span>':'')
        +(q.twoCol?'<span class="badge-2col">2列</span>':'')
      +'</div>'
      +'<input class="qinput" value="'+esc(q.l)+'" placeholder="質問を入力..." oninput="updQ(\''+s.id+'\',\''+q.id+'\',\'l\',this.value)" onclick="event.stopPropagation()">'
      +'<textarea class="qdesc-in" rows="1" placeholder="説明（任意）" oninput="updQ(\''+s.id+'\',\''+q.id+'\',\'desc\',this.value)" onclick="event.stopPropagation()">'+esc(q.desc||'')+'</textarea>'
      +'<div>'+renderPrev(s.id,q,isActive)+'</div>'
      // アクティブ時: 全質問にフローUI（条件分岐 + 次の質問）を表示
      +(isActive?renderFlowUI(s,q):'')
      // アクションボタン
      +'<div class="qacts">'
        +'<button class="qa" onclick="event.stopPropagation();moveQ(\''+s.id+'\',\''+q.id+'\',-1)" title="上へ">↑</button>'
        +'<button class="qa" onclick="event.stopPropagation();moveQ(\''+s.id+'\',\''+q.id+'\',1)" title="下へ">↓</button>'
        +'<button class="qa del" onclick="event.stopPropagation();removeQ(\''+s.id+'\',\''+q.id+'\')" title="削除">🗑</button>'
      +'</div>'
    +'</div>';
  });
  return html;
}

function renderFlowUI(s,q){
  // このセクション内で、この質問より後の質問リスト（+ 特殊オプション）
  var qi=s.questions.findIndex(function(x){return x.id===q.id;});
  var after=s.questions.filter(function(x,i){return i>qi;}); // 後続質問
  var all=s.questions.filter(function(x){return x.id!==q.id;}); // 全他質問
  var hasChoice=['radio','checkbox','select'].includes(q.t)&&q.opts&&q.opts.length>0;
  var html='<div class="branch-ui">';

  // 1) 選択肢系: 選択肢ごとの条件分岐
  if(hasChoice){
    html+='<div class="branch-title">🔀 選択肢ごとに次の質問を設定</div>';
    q.opts.forEach(function(opt,oi){
      var cur=(q.branches&&q.branches[opt])||'';
      html+='<div class="brow">'
        +'<span class="b-opt" title="'+esc(opt)+'">'+esc(opt.length>10?opt.slice(0,10)+'…':opt)+'</span>'
        +'<span class="b-arr">→</span>'
        +'<select class="b-sel" onclick="event.stopPropagation()" onchange="setBranch(\''+s.id+'\',\''+q.id+'\','+oi+',this.value)">'
          +'<option value="">次の質問（順番通り）</option>'
          +all.map(function(x,i){
            var idx=s.questions.indexOf(x)+1;
            return '<option value="'+x.id+'"'+(cur===x.id?' selected':'')+'>Q'+idx+'. '+esc(x.l.slice(0,18))+'</option>';
          }).join('')
          +'<option value="skip_section"'+(cur==='skip_section'?' selected':'')+'>⏭ セクション終了</option>'
          +'<option value="end"'+(cur==='end'?' selected':'')+'>✅ 送信画面へ</option>'
        +'</select>'
      +'</div>';
    });
    // デフォルト（どの選択肢にも一致しない場合）のnextQ
    if(after.length){
      html+='<div class="brow" style="border-top:1px solid rgba(108,99,255,.12);margin-top:5px;padding-top:5px;">'
        +'<span class="b-opt" style="background:rgba(108,99,255,.04);color:var(--muted);">その他</span>'
        +'<span class="b-arr">→</span>'
        +'<select class="b-sel" onclick="event.stopPropagation()" onchange="setNextQ(\''+s.id+'\',\''+q.id+'\',this.value)">'
          +'<option value="">次の質問（順番通り）</option>'
          +all.map(function(x){
            var idx=s.questions.indexOf(x)+1;
            return '<option value="'+x.id+'"'+((q.nextQ||'')==x.id?' selected':'')+'>Q'+idx+'. '+esc(x.l.slice(0,18))+'</option>';
          }).join('')
          +'<option value="skip_section"'+((q.nextQ||'')==='skip_section'?' selected':'')+'>⏭ セクション終了</option>'
          +'<option value="end"'+((q.nextQ||'')==='end'?' selected':'')+'>✅ 送信画面へ</option>'
        +'</select>'
      +'</div>';
    }
  } else {
    // 2) 通常質問: 「回答後に進む質問」を設定
    if(!all.length){return '';} // 他に質問がなければ表示しない
    html+='<div class="branch-title">➡️ 回答後に進む質問</div>';
    html+='<div class="brow">'
      +'<span class="b-opt" style="background:rgba(108,99,255,.04);color:var(--muted);">回答後</span>'
      +'<span class="b-arr">→</span>'
      +'<select class="b-sel" onclick="event.stopPropagation()" onchange="setNextQ(\''+s.id+'\',\''+q.id+'\',this.value)">'
        +'<option value="">次の質問（順番通り）</option>'
        +all.map(function(x){
          var idx=s.questions.indexOf(x)+1;
          return '<option value="'+x.id+'"'+((q.nextQ||'')==x.id?' selected':'')+'>Q'+idx+'. '+esc(x.l.slice(0,18))+'</option>';
        }).join('')
        +'<option value="skip_section"'+((q.nextQ||'')==='skip_section'?' selected':'')+'>⏭ セクション終了</option>'
        +'<option value="end"'+((q.nextQ||'')==='end'?' selected':'')+'>✅ 送信画面へ</option>'
      +'</select>'
    +'</div>';
  }
  return html+'</div>';
}

function renderSecNext(s,si){
  var otherSecs=sections.filter(function(x){return x.id!==s.id;});
  var cur=s.nextSection||'';
  return '<div class="sec-next-box">'
    +'<div class="sec-next-title">📌 このセクション後に進む先</div>'
    +'<select class="sec-next-sel" onclick="event.stopPropagation()" onchange="updSection(\''+s.id+'\',\'nextSection\',this.value)">'
      +'<option value="">次のセクション（順番通り）</option>'
      +otherSecs.map(function(x){return '<option value="'+x.id+'"'+(cur===x.id?' selected':'')+'>'+esc(x.title.slice(0,24))+'</option>';}).join('')
      +'<option value="end"'+(cur==='end'?' selected':'')+'>→ 送信画面へ</option>'
    +'</select>'
  +'</div>';
}

function renderPrev(sid,q,isActive){
  var c='color:var(--muted)';
  if(q.t==='2col'){
    // 2カラムプレビュー
    return '<div style="display:flex;gap:8px;">'
      +'<div style="flex:1"><div style="font-size:.7rem;color:var(--muted);margin-bottom:3px;">'+(q.l||'左の項目')+'</div><input class="pinput" placeholder="例：山田" style="'+c+'" disabled></div>'
      +'<div style="flex:1"><div style="font-size:.7rem;color:var(--muted);margin-bottom:3px;">'+(q.colLabel||'右の項目')+'</div><input class="pinput" placeholder="例：太郎" style="'+c+'" disabled></div>'
    +'</div>';
  }
  switch(q.t){
    case 'short': return '<input class="pinput" placeholder="'+(q.ph||'短文回答')+'" style="'+c+'" disabled>';
    case 'long':  return '<textarea class="ptextarea" placeholder="'+(q.ph||'長文回答')+'" style="'+c+'" disabled></textarea>';
    case 'number':return '<input class="pinput" type="number" placeholder="0" style="'+c+'" disabled>';
    case 'email': return '<input class="pinput" type="email" placeholder="example@email.com" style="'+c+'" disabled>';
    case 'tel':   return '<input class="pinput" type="tel" placeholder="090-0000-0000" style="'+c+'" disabled>';
    case 'date':  return '<input class="pinput" type="date" style="'+c+'" disabled>';
    case 'time':  return '<input class="pinput" type="time" style="'+c+'" disabled>';
    case 'url':   return '<input class="pinput" type="url" placeholder="https://" style="'+c+'" disabled>';
    case 'select':
    case 'radio':
    case 'checkbox':{
      var sh=q.t==='radio'?'ocircle':(q.t==='checkbox'?'osquare':'');
      var isSelect=q.t==='select';
      var html='<div class="popts">';
      (q.opts||[]).forEach(function(o,i){
        html+='<div class="popt">';
        if(isSelect){
          html+='<span style="font-size:.7rem;color:var(--muted);min-width:14px;">'+String.fromCharCode(9650)+'</span>';
        } else {
          html+='<div class="'+sh+'"></div>';
        }
        if(isActive){
          // インライン編集可能なテキスト入力
          html+='<input style="flex:1;border:none;outline:none;background:transparent;font-size:.8rem;color:var(--text);font-family:Inter,sans-serif;" value="'+esc(o)+'" onclick="event.stopPropagation()" oninput="editOptInline(\''+sid+'\',\''+q.id+'\','+i+',this.value)">';
          html+='<button class="btn-xopt" onclick="event.stopPropagation();removeOpt(\''+sid+'\',\''+q.id+'\','+i+')" title="削除">✕</button>';
        } else {
          html+=esc(o);
        }
        html+='</div>';
      });
      if(isActive){
        html+='<button class="btn-aopt" onclick="event.stopPropagation();addOpt(\''+sid+'\',\''+q.id+'\')">＋ 選択肢を追加</button>';
      }
      return html+'</div>';
    }
    case 'rating': return '<div class="pstars">★★★★★</div>';
    case 'slider': return '<input type="range" min="0" max="100" value="50" style="width:100%;accent-color:'+theme+'" disabled>';
    case 'file':   return '<div style="border:2px dashed var(--bg2);border-radius:7px;padding:10px;text-align:center;color:var(--muted);font-size:.75rem;">📎 ファイルを選択</div>';
    case 'agree':  return '<label style="display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--text)"><input type="checkbox" disabled style="accent-color:'+theme+';width:13px;height:13px;">'+esc(q.l)+'</label>';
    default: return '<input class="pinput" placeholder="回答" style="'+c+'" disabled>';
  }
}

function renderRight(){
  var props=document.getElementById('rprops');
  // アクティブな質問を探す
  if(!activeQId){
    // セクション設定を表示
    var s=sections.find(function(x){return x.id===activeSecId;});
    if(!s){props.innerHTML='<p style="font-size:.78rem;color:var(--muted);line-height:1.7;">左のセクションか質問をクリックしてください</p>';return;}
    var colors=['#6C63FF','#FF6584','#00B4D8','#06D6A0','#F77F00'];
    props.innerHTML='<div style="font-size:.73rem;font-weight:700;color:var(--p);margin-bottom:10px;">📌 セクション設定</div>'
      +'<div class="prow"><label class="plbl">セクションカラー</label><div style="display:flex;gap:6px;margin-top:4px;">'
      +colors.map(function(c){return '<div style="width:22px;height:22px;border-radius:50%;background:'+c+';cursor:pointer;border:2px solid '+(s.color===c?'#1A1A2E':'transparent')+';transition:all .15s" onclick="updSection(\''+s.id+'\',\'color\',\''+c+'\');renderAll()"></div>';}).join('')
      +'</div></div>';
    return;
  }
  var foundSec=null, foundQ=null;
  sections.forEach(function(s){
    s.questions.forEach(function(q){if(q.id===activeQId){foundSec=s;foundQ=q;}});
  });
  if(!foundQ){props.innerHTML='<p style="font-size:.78rem;color:var(--muted);">質問が見つかりません</p>';return;}
  var q=foundQ, s=foundSec;
  var opts=FT.map(function(f){return '<option value="'+f.t+'"'+(q.t===f.t?' selected':'')+'>'+f.i+' '+f.l+'</option>';}).join('');
  var html='<div class="prow"><label class="plbl">タイプ</label><select class="psel" onchange="changeType(\''+s.id+'\',\''+q.id+'\',this.value)">'+opts+'</select></div>'
    +'<div class="req-row"><label class="plbl" style="margin:0">必須</label><button class="tog'+(q.req?' on':'')+'" onclick="updQ(\''+s.id+'\',\''+q.id+'\',\'req\',!'+q.req+');this.classList.toggle(\'on\')"></button></div>';
  if(q.t==='2col'){
    html+='<div class="prow"><label class="plbl">左ラベル（例：姓）</label><input class="pinp" value="'+esc(q.l)+'" placeholder="姓" oninput="updQ(\''+s.id+'\',\''+q.id+'\',\'l\',this.value);renderCanvas()"></div>'
      +'<div class="prow"><label class="plbl">右ラベル（例：名）</label><input class="pinp" value="'+esc(q.colLabel||'')+'" placeholder="名" oninput="updQ(\''+s.id+'\',\''+q.id+'\',\'colLabel\',this.value);renderCanvas()"></div>';
  } else {
    html+='<div class="prow"><label class="plbl">プレースホルダー</label><input class="pinp" value="'+esc(q.ph||'')+'" placeholder="回答例..." oninput="updQ(\''+s.id+'\',\''+q.id+'\',\'ph\',this.value)"></div>';
  }
  props.innerHTML=html;
}

// ===== UI =====
function switchTab(t,el){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
  el.classList.add('on');
  document.getElementById('tabQ').classList.toggle('hide',t!=='q');
  document.getElementById('tabS').classList.toggle('hide',t!=='s');
}
function setTheme(el){
  document.querySelectorAll('.dot').forEach(function(d){d.classList.remove('on');});
  el.classList.add('on');theme=el.dataset.c;
  document.documentElement.style.setProperty('--p',theme);renderCanvas();
}
function getSettings(){
  return{
    publishAt:document.getElementById('tgPub').classList.contains('on')?document.getElementById('iPub').value||null:null,
    deadline:document.getElementById('tgD').classList.contains('on')?document.getElementById('iD').value||null:null,
    capacity:document.getElementById('tgC').classList.contains('on')?document.getElementById('iC').value||null:null,
    password:document.getElementById('tgP').classList.contains('on')?document.getElementById('iP').value||null:null,
    oneResponse:document.getElementById('tgO').classList.contains('on'),
    thankMsg:document.getElementById('thankMsg').value||'ご回答ありがとうございました！',
    redirectUrl:document.getElementById('redirectUrl').value||null,
  };
}
function previewForm(){
  localStorage.setItem('preview_form',JSON.stringify({
    title:document.getElementById('cTitle').value,
    description:document.getElementById('cDesc').value,
    sections:sections,themeColor:theme,settings:getSettings()
  }));
  window.open('form.html?preview=local','_blank');
}
async function saveForm(){
  if(!currentUser){showToast('⚠️ ログインが必要です');setTimeout(function(){location.href='index.html';},1400);return;}
  showToast('💾 保存中...');
  var data={
    title:document.getElementById('cTitle').value,
    description:document.getElementById('cDesc').value,
    sections:sections,themeColor:theme,
    userId:currentUser.uid,updatedAt:new Date().toISOString(),settings:getSettings()
  };
  try{
    if(formId){await db.collection('forms').doc(formId).set(data,{merge:true});}
    else{data.createdAt=new Date().toISOString();data.responseCount=0;
      var ref=await db.collection('forms').add(data);formId=ref.id;
      history.replaceState(null,'','?id='+formId);}
    showPubModal(formId);
  }catch(ex){showToast('❌ エラー: '+ex.message);}
}
function showPubModal(fid){
  var base=location.href.replace(/[^\/]*\.html.*/,'');
  var url=base+'form.html?id='+fid;
  document.getElementById('pubUrl').textContent=url;
  document.getElementById('pubLink').href=url;
  var div=document.getElementById('qrDiv');div.innerHTML='';
  new QRCode(div,{text:url,width:160,height:160,colorDark:'#1A1A2E',colorLight:'#F8F9FF',correctLevel:QRCode.CorrectLevel.M});
  document.getElementById('pubModal').classList.add('open');
}
function closePub(){document.getElementById('pubModal').classList.remove('open');}
function copyUrl(){navigator.clipboard.writeText(document.getElementById('pubUrl').textContent);showToast('✅ コピーしました');}
function dlQr(){var img=document.querySelector('#qrDiv img');if(!img){showToast('お待ちください');return;}var a=document.createElement('a');a.download='formly-qr.png';a.href=img.src;a.click();}
document.getElementById('pubModal').addEventListener('click',function(ev){if(ev.target===this)closePub();});
var toastTimer;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2800);}
</script>
