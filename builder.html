<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フォームビルダー — Formly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple:#6C63FF; --purple-light:#8B85FF; --purple-dark:#4A42CC;
    --coral:#FF6584; --dark:#1A1A2E; --bg:#F8F9FF; --bg2:#EEEEFF;
    --text:#2D2D4E; --muted:#7B7B9E; --white:#FFFFFF;
    --border:rgba(108,99,255,0.12);
    --card-shadow:0 2px 12px rgba(108,99,255,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

  /* TOP BAR */
  .topbar{
    height:60px;background:var(--white);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;
    position:relative;z-index:10;
  }
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;
    background:linear-gradient(135deg,var(--purple),var(--coral));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    text-decoration:none;}
  .sep{width:1px;height:24px;background:var(--border);}
  .form-name-input{
    border:none;outline:none;font-size:0.95rem;font-weight:600;
    color:var(--text);font-family:'Syne',sans-serif;
    background:transparent;width:240px;
  }
  .form-name-input::placeholder{color:var(--muted);}
  .topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center;}
  .btn-sm{
    padding:8px 18px;border-radius:8px;font-size:0.85rem;font-weight:600;
    cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all 0.2s;
  }
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--purple);color:var(--purple);}
  .btn-primary-sm{background:var(--purple);color:#fff;box-shadow:0 3px 12px rgba(108,99,255,0.30);}
  .btn-primary-sm:hover{background:var(--purple-dark);}
  .btn-danger{background:transparent;border:1.5px solid rgba(255,101,132,0.3);color:var(--coral);}
  .btn-danger:hover{background:rgba(255,101,132,0.08);}
  .theme-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;}
  .theme-dot.active{border-color:var(--text);}

  /* MAIN LAYOUT */
  .builder-main{display:flex;flex:1;overflow:hidden;}

  /* LEFT PANEL */
  .left-panel{
    width:320px;flex-shrink:0;background:var(--white);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .panel-tabs{display:flex;border-bottom:1px solid var(--border);}
  .panel-tab{
    flex:1;padding:12px 8px;text-align:center;font-size:0.8rem;font-weight:600;
    cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;
    transition:all 0.2s;
  }
  .panel-tab.active{color:var(--purple);border-bottom-color:var(--purple);}
  .panel-body{flex:1;overflow-y:auto;padding:16px;}

  /* FIELD LIST */
  .questions-list{display:flex;flex-direction:column;gap:8px;}
  .question-item{
    background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
    padding:12px 14px;cursor:pointer;transition:all 0.2s;
    display:flex;align-items:center;gap:10px;position:relative;
  }
  .question-item:hover{border-color:var(--purple-light);}
  .question-item.active{border-color:var(--purple);background:rgba(108,99,255,0.04);}
  .q-icon{width:32px;height:32px;border-radius:8px;background:rgba(108,99,255,0.10);
    display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;}
  .q-info{flex:1;min-width:0;}
  .q-label{font-size:0.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q-type{font-size:0.72rem;color:var(--muted);}
  .q-del{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;opacity:0;}
  .question-item:hover .q-del{opacity:1;}
  .q-del:hover{color:var(--coral);}
  .q-num{font-size:0.7rem;color:var(--muted);font-weight:700;width:16px;text-align:center;flex-shrink:0;}

  /* ADD FIELD */
  .add-field-section{padding:16px;border-top:1px solid var(--border);}
  .add-field-title{font-size:0.75rem;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.08em;}
  .field-types-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .field-type-btn{
    background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
    padding:8px 4px;text-align:center;cursor:pointer;font-size:0.7rem;
    font-weight:600;color:var(--muted);transition:all 0.2s;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .field-type-btn:hover{border-color:var(--purple);color:var(--purple);background:rgba(108,99,255,0.06);}
  .field-type-btn .icon{font-size:1rem;}

  /* SETTINGS PANEL */
  .settings-section{margin-bottom:20px;}
  .settings-title{font-size:0.75rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
  .setting-row{display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--border);}
  .setting-row:last-child{border-bottom:none;}
  .setting-label{font-size:0.85rem;font-weight:500;}
  .setting-sub{font-size:0.75rem;color:var(--muted);}
  .toggle{
    width:40px;height:22px;border-radius:11px;background:var(--bg2);
    border:none;cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0;
  }
  .toggle.on{background:var(--purple);}
  .toggle::after{
    content:'';position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;top:3px;left:3px;transition:left 0.2s;
    box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle.on::after{left:21px;}
  .setting-input{
    width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:0.85rem;font-family:'Inter',sans-serif;background:var(--bg);
    color:var(--text);outline:none;margin-top:6px;
  }
  .setting-input:focus{border-color:var(--purple);}
  .color-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;}
  .swatch.active{border-color:var(--text);transform:scale(1.1);}

  /* CENTER - BUILDER CANVAS */
  .center-panel{
    flex:1;overflow-y:auto;padding:32px 24px;
    display:flex;flex-direction:column;gap:0;align-items:center;
  }
  .form-header-card{
    background:var(--white);border-radius:20px 20px 0 0;
    padding:36px 36px 28px;width:100%;max-width:680px;
    border:1.5px solid var(--border);border-bottom:none;
  }
  .form-color-bar{height:8px;border-radius:4px;background:var(--purple);margin-bottom:28px;}
  .form-header-card input[type=text]{
    font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;
    border:none;outline:none;background:transparent;width:100%;
    color:var(--dark);margin-bottom:8px;
  }
  .form-header-card textarea{
    font-family:'Inter',sans-serif;font-size:0.92rem;color:var(--muted);
    border:none;outline:none;background:transparent;width:100%;resize:none;
    line-height:1.6;
  }

  .question-card{
    background:var(--white);border:1.5px solid var(--border);
    padding:28px 36px;width:100%;max-width:680px;
    transition:all 0.2s;position:relative;cursor:pointer;
  }
  .question-card:hover{border-color:var(--purple-light);}
  .question-card.active{border-color:var(--purple);border-left:4px solid var(--purple);}
  .question-card:last-of-type{border-radius:0 0 20px 20px;border-bottom:1.5px solid var(--border);}

  .card-num{font-size:0.72rem;color:var(--muted);font-weight:700;margin-bottom:8px;
    display:flex;align-items:center;gap:6px;}
  .card-required{color:var(--coral);}
  .card-question-input{
    font-size:1rem;font-weight:600;border:none;outline:none;
    background:transparent;width:100%;color:var(--text);font-family:'Inter',sans-serif;
    margin-bottom:6px;
  }
  .card-desc-input{
    font-size:0.85rem;color:var(--muted);border:none;outline:none;
    background:transparent;width:100%;font-family:'Inter',sans-serif;
    margin-bottom:16px;resize:none;
  }
  .field-preview{margin-top:4px;}
  .preview-input{
    width:100%;padding:10px 14px;border:1.5px solid var(--bg2);
    border-radius:10px;font-size:0.9rem;background:var(--bg);
    color:var(--muted);font-family:'Inter',sans-serif;pointer-events:none;
  }
  .preview-textarea{
    width:100%;padding:10px 14px;border:1.5px solid var(--bg2);
    border-radius:10px;font-size:0.9rem;background:var(--bg);
    color:var(--muted);font-family:'Inter',sans-serif;height:80px;resize:none;pointer-events:none;
  }
  .preview-options{display:flex;flex-direction:column;gap:8px;}
  .preview-option{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border:1.5px solid var(--bg2);border-radius:10px;background:var(--bg);
    font-size:0.9rem;color:var(--muted);cursor:pointer;
    transition:border-color 0.2s;
  }
  .preview-option:hover{border-color:var(--purple-light);}
  .option-circle{width:16px;height:16px;border-radius:50%;border:2px solid var(--bg2);flex-shrink:0;}
  .option-square{width:16px;height:16px;border-radius:4px;border:2px solid var(--bg2);flex-shrink:0;}
  .option-edit-btn{
    background:none;border:none;cursor:pointer;color:var(--purple);
    font-size:0.75rem;font-weight:600;padding:4px 8px;
    border-radius:6px;background:rgba(108,99,255,0.08);margin-left:auto;
  }
  .add-option-btn{
    background:none;border:none;cursor:pointer;color:var(--purple);
    font-size:0.82rem;font-weight:600;padding:4px 0;display:flex;align-items:center;gap:6px;
  }
  .stars{display:flex;gap:6px;}
  .star{font-size:1.4rem;color:#FEC02F;cursor:pointer;}
  .card-actions{
    display:none;position:absolute;bottom:-1px;right:16px;
    background:var(--white);border:1.5px solid var(--border);
    border-top:none;border-radius:0 0 10px 10px;
    padding:6px 12px;gap:8px;align-items:center;
  }
  .question-card.active .card-actions{display:flex;}
  .action-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);
    font-size:0.78rem;font-weight:600;padding:4px 8px;border-radius:6px;
    font-family:'Inter',sans-serif;transition:all 0.2s;display:flex;align-items:center;gap:4px;
  }
  .action-btn:hover{background:var(--bg);color:var(--purple);}
  .action-btn.delete:hover{color:var(--coral);}

  .add-question-row{
    width:100%;max-width:680px;margin-top:16px;
    display:flex;gap:10px;justify-content:center;
  }
  .btn-add-question{
    background:var(--white);border:1.5px dashed rgba(108,99,255,0.30);
    border-radius:12px;padding:14px 28px;cursor:pointer;
    font-size:0.88rem;font-weight:600;color:var(--purple);
    font-family:'Inter',sans-serif;transition:all 0.2s;
    display:flex;align-items:center;gap:8px;
  }
  .btn-add-question:hover{border-color:var(--purple);background:rgba(108,99,255,0.04);}

  /* RIGHT PANEL - QUESTION SETTINGS */
  .right-panel{
    width:280px;flex-shrink:0;background:var(--white);
    border-left:1px solid var(--border);overflow-y:auto;padding:16px;
  }
  .right-title{font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:700;
    color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;}
  .prop-row{margin-bottom:16px;}
  .prop-label{font-size:0.78rem;font-weight:600;color:var(--text);margin-bottom:6px;display:block;}
  .prop-input{
    width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:0.85rem;font-family:'Inter',sans-serif;background:var(--bg);
    color:var(--text);outline:none;
  }
  .prop-input:focus{border-color:var(--purple);}
  .prop-select{
    width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:0.85rem;font-family:'Inter',sans-serif;background:var(--bg);
    color:var(--text);outline:none;appearance:none;cursor:pointer;
  }
  .branch-card{
    background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
    padding:12px;margin-top:8px;font-size:0.8rem;
  }
  .branch-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .branch-row:last-child{margin-bottom:0;}
  .branch-select{
    flex:1;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;
    font-size:0.78rem;font-family:'Inter',sans-serif;background:var(--white);
    color:var(--text);outline:none;
  }
  .branch-arrow{font-size:0.7rem;color:var(--purple);font-weight:700;}

  /* TOAST */
  .toast{
    position:fixed;bottom:24px;right:24px;z-index:999;
    background:var(--dark);color:#fff;border-radius:12px;padding:14px 24px;
    font-size:0.88rem;font-weight:500;display:none;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);animation:slideUp 0.3s ease;
  }
  .toast.show{display:block;}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <a href="index.html" class="logo">Formly</a>
  <div class="sep"></div>
  <input class="form-name-input" id="formTitle" placeholder="フォームのタイトルを入力..." value="新しいフォーム">
  <div class="topbar-right">
    <div style="display:flex;gap:6px;align-items:center;margin-right:8px;">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;">テーマ：</span>
      <div class="theme-dot active" style="background:#6C63FF;" data-color="#6C63FF" onclick="setTheme(this)"></div>
      <div class="theme-dot" style="background:#FF6584;" data-color="#FF6584" onclick="setTheme(this)"></div>
      <div class="theme-dot" style="background:#00B4D8;" data-color="#00B4D8" onclick="setTheme(this)"></div>
      <div class="theme-dot" style="background:#06D6A0;" data-color="#06D6A0" onclick="setTheme(this)"></div>
      <div class="theme-dot" style="background:#F77F00;" data-color="#F77F00" onclick="setTheme(this)"></div>
    </div>
    <button class="btn-sm btn-outline" onclick="previewForm()">👁 プレビュー</button>
    <button class="btn-sm btn-primary-sm" onclick="saveForm()">💾 保存して公開</button>
  </div>
</div>

<div class="builder-main">
  <!-- LEFT: Question List + Add -->
  <div class="left-panel">
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchPanelTab('questions',this)">質問</div>
      <div class="panel-tab" onclick="switchPanelTab('settings',this)">設定</div>
    </div>
    <div class="panel-body" id="panelQuestions">
      <div class="questions-list" id="questionsList"></div>
      <div style="margin-top:16px;">
        <div class="add-field-title">フィールドを追加</div>
        <div class="field-types-grid" id="fieldTypesGrid"></div>
      </div>
    </div>
    <div class="panel-body" id="panelSettings" style="display:none;">
      <div class="settings-section">
        <div class="settings-title">フォーム設定</div>
        <div class="setting-row">
          <div><div class="setting-label">締切日時</div><div class="setting-sub">自動で回答を終了</div></div>
          <button class="toggle" id="deadlineToggle" onclick="this.classList.toggle('on');document.getElementById('deadlineInput').style.display=this.classList.contains('on')?'block':'none'"></button>
        </div>
        <input class="setting-input" type="datetime-local" id="deadlineInput" style="display:none;" placeholder="締切日時">
        <div class="setting-row">
          <div><div class="setting-label">定員制限</div><div class="setting-sub">最大回答数を設定</div></div>
          <button class="toggle" id="capacityToggle" onclick="this.classList.toggle('on');document.getElementById('capacityInput').style.display=this.classList.contains('on')?'block':'none'"></button>
        </div>
        <input class="setting-input" type="number" id="capacityInput" style="display:none;" placeholder="定員数（例：50）">
        <div class="setting-row">
          <div><div class="setting-label">パスワード保護</div><div class="setting-sub">限定公開フォーム</div></div>
          <button class="toggle" id="passwordToggle" onclick="this.classList.toggle('on');document.getElementById('passwordInput').style.display=this.classList.contains('on')?'block':'none'"></button>
        </div>
        <input class="setting-input" type="text" id="passwordInput" style="display:none;" placeholder="パスワードを設定">
        <div class="setting-row">
          <div><div class="setting-label">回答を1人1回に制限</div><div class="setting-sub">ログインユーザーのみ</div></div>
          <button class="toggle" id="oneResponseToggle" onclick="this.classList.toggle('on')"></button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">完了ページ</div>
        <input class="setting-input" placeholder="完了メッセージ" value="ご回答ありがとうございました！">
        <input class="setting-input" style="margin-top:8px;" placeholder="リダイレクトURL（オプション）">
      </div>
    </div>
  </div>

  <!-- CENTER: Form Canvas -->
  <div class="center-panel" id="centerPanel">
    <div class="form-header-card">
      <div class="form-color-bar" id="colorBar"></div>
      <input type="text" id="canvasTitle" placeholder="フォームタイトル" value="新しいフォーム" oninput="document.getElementById('formTitle').value=this.value">
      <textarea placeholder="フォームの説明（任意）" rows="2" id="canvasDesc"></textarea>
    </div>
    <div id="questionsCanvas"></div>
    <div class="add-question-row">
      <button class="btn-add-question" onclick="addQuestion('short')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        質問を追加
      </button>
    </div>
  </div>

  <!-- RIGHT: Question Properties -->
  <div class="right-panel" id="rightPanel">
    <div class="right-title">質問の設定</div>
    <div id="questionProps">
      <p style="font-size:0.85rem;color:var(--muted);line-height:1.6;">キャンバスの質問をクリックして設定を編集</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDarChAwm9_4t4CRfPiM5dVI84MjQPe5ms",
  authDomain: "senkyo-29a84.firebaseapp.com",
  projectId: "senkyo-29a84",
  storageBucket: "senkyo-29a84.firebasestorage.app",
  messagingSenderId: "734912107336",
  appId: "1:734912107336:web:b57350fc64038f7611997d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// STATE
let questions = [];
let activeQid = null;
let themeColor = '#6C63FF';
let currentUser = null;
let formId = null;

onAuthStateChanged(auth, user => { currentUser = user; });

// Check if editing existing form
const urlParams = new URLSearchParams(location.search);
const editId = urlParams.get('id');
const template = urlParams.get('template');

if(editId) loadForm(editId);
else if(template) loadTemplate(template);
else initDefaultQuestions();

function initDefaultQuestions() {
  addQuestion('short', 'お名前', true);
  addQuestion('email', 'メールアドレス', true);
}

async function loadForm(id) {
  try {
    const snap = await getDoc(doc(db,'forms',id));
    if(snap.exists()) {
      const data = snap.data();
      formId = id;
      document.getElementById('formTitle').value = data.title || '';
      document.getElementById('canvasTitle').value = data.title || '';
      document.getElementById('canvasDesc').value = data.description || '';
      questions = data.questions || [];
      themeColor = data.themeColor || '#6C63FF';
      renderAll();
    }
  } catch(e) { console.error(e); }
}

function loadTemplate(tmpl) {
  const templates = {
    contact: {
      title:'お問い合わせ', desc:'お気軽にご連絡ください',
      questions:[
        {id:uid(),type:'short',label:'お名前',required:true,options:[]},
        {id:uid(),type:'email',label:'メールアドレス',required:true,options:[]},
        {id:uid(),type:'long',label:'お問い合わせ内容',required:true,options:[]},
      ]
    },
    attendance: {
      title:'出欠確認', desc:'出席・欠席をお知らせください',
      questions:[
        {id:uid(),type:'short',label:'お名前',required:true,options:[]},
        {id:uid(),type:'radio',label:'出欠',required:true,options:['出席','欠席','未定']},
        {id:uid(),type:'long',label:'備考・メッセージ',required:false,options:[]},
      ]
    },
    event: {
      title:'イベント申込', desc:'定員に達し次第、締め切ります',
      questions:[
        {id:uid(),type:'short',label:'お名前',required:true,options:[]},
        {id:uid(),type:'email',label:'メールアドレス',required:true,options:[]},
        {id:uid(),type:'radio',label:'参加人数',required:true,options:['1名','2名','3名以上']},
        {id:uid(),type:'long',label:'ご要望・アレルギーなど',required:false,options:[]},
        {id:uid(),type:'agree',label:'参加規約に同意します',required:true,options:[]},
      ]
    },
    survey: {
      title:'満足度アンケート', desc:'ご意見をお聞かせください',
      questions:[
        {id:uid(),type:'rating',label:'総合満足度',required:true,options:[]},
        {id:uid(),type:'radio',label:'サービスを知ったきっかけ',required:false,options:['SNS','紹介','検索','広告']},
        {id:uid(),type:'long',label:'改善してほしい点',required:false,options:[]},
        {id:uid(),type:'checkbox',label:'興味のあるサービス（複数選択可）',required:false,options:['プランA','プランB','プランC','その他']},
      ]
    },
    vote: {
      title:'投票フォーム', desc:'1人1票、正直に！',
      questions:[
        {id:uid(),type:'short',label:'お名前（任意）',required:false,options:[]},
        {id:uid(),type:'radio',label:'投票先を選んでください',required:true,options:['候補A','候補B','候補C']},
        {id:uid(),type:'long',label:'コメント（任意）',required:false,options:[]},
      ]
    },
  };
  const t = templates[tmpl];
  if(t) {
    document.getElementById('formTitle').value = t.title;
    document.getElementById('canvasTitle').value = t.title;
    document.getElementById('canvasDesc').value = t.desc;
    questions = t.questions;
    renderAll();
  } else initDefaultQuestions();
}

// FIELD TYPES
const FIELD_TYPES = [
  {type:'short', icon:'✏️', label:'短文'},
  {type:'long', icon:'📝', label:'長文'},
  {type:'number', icon:'🔢', label:'数字'},
  {type:'email', icon:'📧', label:'メール'},
  {type:'tel', icon:'📞', label:'電話'},
  {type:'date', icon:'📅', label:'日付'},
  {type:'time', icon:'⏰', label:'時間'},
  {type:'radio', icon:'🔘', label:'ラジオ'},
  {type:'checkbox', icon:'☑️', label:'チェック'},
  {type:'select', icon:'▾', label:'プルダウン'},
  {type:'rating', icon:'⭐', label:'評価'},
  {type:'slider', icon:'🎚', label:'スライダー'},
  {type:'file', icon:'📎', label:'ファイル'},
  {type:'agree', icon:'✅', label:'同意'},
  {type:'url', icon:'🔗', label:'URL'},
];

function uid() { return Math.random().toString(36).slice(2,10); }

function addQuestion(type='short', label='', required=false) {
  const typeInfo = FIELD_TYPES.find(f=>f.type===type)||FIELD_TYPES[0];
  const q = {
    id: uid(), type, required,
    label: label || typeInfo.label + 'の質問',
    description: '',
    options: ['radio','checkbox','select'].includes(type) ? ['選択肢1','選択肢2','選択肢3'] : [],
    branchEnabled: false,
    branches: [],
  };
  questions.push(q);
  renderAll();
  setActiveQuestion(q.id);
}

function removeQuestion(id) {
  questions = questions.filter(q=>q.id!==id);
  if(activeQid===id) activeQid = questions.length ? questions[questions.length-1].id : null;
  renderAll();
}

function setActiveQuestion(id) {
  activeQid = id;
  renderAll();
}

function renderAll() {
  renderLeftList();
  renderCanvas();
  renderFieldTypes();
  renderRightPanel();
}

function renderLeftList() {
  const list = document.getElementById('questionsList');
  list.innerHTML = questions.map((q,i)=>{
    const info = FIELD_TYPES.find(f=>f.type===q.type)||FIELD_TYPES[0];
    return `<div class="question-item ${activeQid===q.id?'active':''}" onclick="setActiveQuestion('${q.id}')">
      <span class="q-num">${i+1}</span>
      <div class="q-icon">${info.icon}</div>
      <div class="q-info">
        <div class="q-label">${q.label}</div>
        <div class="q-type">${info.label}</div>
      </div>
      <button class="q-del" onclick="event.stopPropagation();removeQuestion('${q.id}')" title="削除">✕</button>
    </div>`;
  }).join('');
}

function renderFieldTypes() {
  document.getElementById('fieldTypesGrid').innerHTML = FIELD_TYPES.map(f=>`
    <div class="field-type-btn" onclick="addQuestion('${f.type}')">
      <span class="icon">${f.icon}</span>${f.label}
    </div>`).join('');
}

function renderCanvas() {
  const canvas = document.getElementById('questionsCanvas');
  document.getElementById('colorBar').style.background = themeColor;
  canvas.innerHTML = questions.map((q,i)=>{
    const isActive = activeQid===q.id;
    return `<div class="question-card ${isActive?'active':''}" id="qcard_${q.id}" onclick="setActiveQuestion('${q.id}')">
      <div class="card-num">
        ${i+1}
        ${q.required?'<span class="card-required">必須</span>':''}
      </div>
      <input class="card-question-input" value="${escHtml(q.label)}" placeholder="質問を入力..."
        oninput="updateQuestion('${q.id}','label',this.value)" onclick="event.stopPropagation()">
      <textarea class="card-desc-input" placeholder="説明（任意）" rows="1"
        oninput="updateQuestion('${q.id}','description',this.value)"
        onclick="event.stopPropagation()">${escHtml(q.description||'')}</textarea>
      <div class="field-preview">${renderFieldPreview(q)}</div>
      <div class="card-actions">
        <button class="action-btn" onclick="event.stopPropagation();duplicateQuestion('${q.id}')">📋 複製</button>
        <button class="action-btn" onclick="event.stopPropagation();moveQuestion('${q.id}',-1)">↑</button>
        <button class="action-btn" onclick="event.stopPropagation();moveQuestion('${q.id}',1)">↓</button>
        <button class="action-btn delete" onclick="event.stopPropagation();removeQuestion('${q.id}')">🗑 削除</button>
      </div>
    </div>`;
  }).join('');
}

function renderFieldPreview(q) {
  const c = `color:var(--muted)`;
  switch(q.type) {
    case 'short': return `<input class="preview-input" placeholder="短文回答" style="${c}" disabled>`;
    case 'long': return `<textarea class="preview-textarea" placeholder="長文回答" style="${c}" disabled></textarea>`;
    case 'number': return `<input class="preview-input" type="number" placeholder="0" style="${c}" disabled>`;
    case 'email': return `<input class="preview-input" type="email" placeholder="example@email.com" style="${c}" disabled>`;
    case 'tel': return `<input class="preview-input" type="tel" placeholder="090-0000-0000" style="${c}" disabled>`;
    case 'date': return `<input class="preview-input" type="date" style="${c}" disabled>`;
    case 'time': return `<input class="preview-input" type="time" style="${c}" disabled>`;
    case 'url': return `<input class="preview-input" type="url" placeholder="https://" style="${c}" disabled>`;
    case 'radio':
    case 'checkbox': {
      const opts = q.options||[];
      const shape = q.type==='radio' ? 'option-circle' : 'option-square';
      return `<div class="preview-options">
        ${opts.map((o,i)=>`<div class="preview-option">
          <div class="${shape}"></div>${escHtml(o)}
          ${activeQid===q.id?`<button class="option-edit-btn" onclick="event.stopPropagation();editOption('${q.id}',${i})">✏️</button>`:''}
        </div>`).join('')}
        ${activeQid===q.id?`<button class="add-option-btn" onclick="event.stopPropagation();addOption('${q.id}')">＋ 選択肢を追加</button>`:''}
      </div>`;
    }
    case 'select': {
      const opts = q.options||[];
      return `<select class="preview-input" disabled style="${c}">
        <option>選択してください</option>
        ${opts.map(o=>`<option>${escHtml(o)}</option>`).join('')}
      </select>`;
    }
    case 'rating': return `<div class="stars">${[1,2,3,4,5].map(n=>`<span class="star">★</span>`).join('')}</div>`;
    case 'slider': return `<input type="range" min="0" max="100" value="50" style="width:100%;accent-color:${themeColor}" disabled>`;
    case 'file': return `<div style="border:2px dashed var(--bg2);border-radius:10px;padding:20px;text-align:center;color:var(--muted);font-size:0.85rem;">📎 ファイルをドロップ、またはクリックして選択</div>`;
    case 'agree': return `<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.9rem;color:var(--text)"><input type="checkbox" disabled style="accent-color:${themeColor};width:16px;height:16px;"> ${escHtml(q.label)}</label>`;
    default: return `<input class="preview-input" placeholder="回答" style="${c}" disabled>`;
  }
}

function renderRightPanel() {
  const props = document.getElementById('questionProps');
  const q = questions.find(x=>x.id===activeQid);
  if(!q) { props.innerHTML='<p style="font-size:0.85rem;color:var(--muted);line-height:1.6;">質問をクリックして設定を編集</p>'; return; }
  props.innerHTML = `
    <div class="prop-row">
      <label class="prop-label">フィールドタイプ</label>
      <select class="prop-select" onchange="updateQuestion('${q.id}','type',this.value);updateQuestion('${q.id}','options',['radio','checkbox','select'].includes(this.value)?['選択肢1','選択肢2']:[])">
        ${FIELD_TYPES.map(f=>`<option value="${f.type}" ${q.type===f.type?'selected':''}>${f.icon} ${f.label}</option>`).join('')}
      </select>
    </div>
    <div class="prop-row">
      <label class="prop-label">必須</label>
      <button class="toggle ${q.required?'on':''}" onclick="updateQuestion('${q.id}','required',!${q.required});this.classList.toggle('on')"></button>
    </div>
    <div class="prop-row">
      <label class="prop-label">プレースホルダー</label>
      <input class="prop-input" value="${escHtml(q.placeholder||'')}" placeholder="回答例..." oninput="updateQuestion('${q.id}','placeholder',this.value)">
    </div>
    <div class="prop-row">
      <label class="prop-label" style="margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
        条件分岐
        <button class="toggle ${q.branchEnabled?'on':''}" onclick="updateQuestion('${q.id}','branchEnabled',!${q.branchEnabled});renderAll()"></button>
      </label>
      ${q.branchEnabled && ['radio','select'].includes(q.type) ? `
      <div class="branch-card">
        <div style="font-size:0.75rem;color:var(--muted);margin-bottom:8px;">回答によって次の質問を変える</div>
        ${(q.options||[]).map((opt,i)=>`
        <div class="branch-row">
          <span style="flex:1;font-size:0.78rem;">${escHtml(opt)}</span>
          <span class="branch-arrow">→</span>
          <select class="branch-select">
            <option>次の質問</option>
            ${questions.filter(x=>x.id!==q.id).map(x=>`<option>${escHtml(x.label.slice(0,20))}</option>`).join('')}
            <option>送信</option>
          </select>
        </div>`).join('')}
      </div>` : ''}
    </div>
  `;
}

function updateQuestion(id, key, value) {
  const q = questions.find(x=>x.id===id);
  if(q) { q[key]=value; renderAll(); }
}

function addOption(id) {
  const q = questions.find(x=>x.id===id);
  if(q) { q.options.push(`選択肢${(q.options||[]).length+1}`); renderAll(); }
}

function editOption(id, idx) {
  const q = questions.find(x=>x.id===id);
  if(!q) return;
  const val = prompt('選択肢を編集:', q.options[idx]);
  if(val!==null) { q.options[idx]=val; renderAll(); }
}

function duplicateQuestion(id) {
  const q = questions.find(x=>x.id===id);
  if(q) {
    const newQ = JSON.parse(JSON.stringify(q));
    newQ.id = uid();
    const idx = questions.indexOf(q);
    questions.splice(idx+1,0,newQ);
    renderAll();
    setActiveQuestion(newQ.id);
  }
}

function moveQuestion(id,dir) {
  const idx = questions.findIndex(x=>x.id===id);
  const newIdx = idx+dir;
  if(newIdx<0||newIdx>=questions.length) return;
  [questions[idx],questions[newIdx]]=[questions[newIdx],questions[idx]];
  renderAll();
}

function escHtml(str='') { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.setActiveQuestion = setActiveQuestion;
window.removeQuestion = removeQuestion;
window.addQuestion = addQuestion;
window.updateQuestion = updateQuestion;
window.addOption = addOption;
window.editOption = editOption;
window.duplicateQuestion = duplicateQuestion;
window.moveQuestion = moveQuestion;

window.setTheme = function(el) {
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  themeColor = el.dataset.color;
  document.documentElement.style.setProperty('--purple', themeColor);
  renderCanvas();
};

window.switchPanelTab = function(tab,el) {
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panelQuestions').style.display = tab==='questions'?'block':'none';
  document.getElementById('panelSettings').style.display = tab==='settings'?'block':'none';
};

window.previewForm = function() {
  const id = formId || 'preview_'+uid();
  localStorage.setItem('preview_form', JSON.stringify({
    id, title: document.getElementById('canvasTitle').value,
    description: document.getElementById('canvasDesc').value,
    questions, themeColor
  }));
  window.open(`form.html?preview=${id}`,'_blank');
};

window.saveForm = async function() {
  if(!currentUser) {
    showToast('⚠️ 保存するにはログインが必要です');
    setTimeout(()=>location.href='index.html',1500);
    return;
  }
  showToast('💾 保存中...');
  const data = {
    title: document.getElementById('canvasTitle').value,
    description: document.getElementById('canvasDesc').value,
    questions, themeColor,
    userId: currentUser.uid,
    createdAt: new Date().toISOString(),
    settings: {
      deadline: document.getElementById('deadlineInput').value||null,
      capacity: document.getElementById('capacityInput').value||null,
      password: document.getElementById('passwordInput').value||null,
      oneResponse: document.getElementById('oneResponseToggle').classList.contains('on'),
    }
  };
  try {
    if(formId) {
      await setDoc(doc(db,'forms',formId), data, {merge:true});
    } else {
      const ref = await addDoc(collection(db,'forms'), data);
      formId = ref.id;
      history.replaceState(null,'',`?id=${formId}`);
    }
    showToast('✅ 公開しました！form.html?id='+formId);
  } catch(e) { showToast('❌ エラー: '+e.message); }
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// Initial render
renderAll();
</script>
</body>
</html>
